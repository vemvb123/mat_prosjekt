services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mat-prosjekt-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${LOCAL_SQL_PASSWORD:-Your_strong_password123}"
    ports:
      - "${LOCAL_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: mat-prosjekt-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local_redis_password}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sqlserver-data:
  redis-data:
